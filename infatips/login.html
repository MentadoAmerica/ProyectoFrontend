<!DOCTYPE html>
<html lang="es" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoSalud - Iniciar Sesión</title>
    
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body class="body-login d-flex align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                
                <div class="card login-card">
                    
                   
    <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="home.html">
                <span class="badge bg-white text-info me-2">💙</span>
                INFA-TIPS
            </a>
            
            <div class="ms-auto">
                <a href="home.html" class="btn btn-light text-info fw-bold rounded-pill">
                    <i class="fas fa-arrow-left me-2"></i>Volver al inicio
                </a>
            </div>
        </div>
    </nav>
                    <div class="login-header">
                        <i class="fas fa-child"></i>
                        <h2 class="h3 mb-1">¡Bienvenido!</h2>
                        <p class="mb-0 opacity-75">Accede a tu cuenta</p>
                        
                    </div>
                    
                    <div class="login-body">
                        
                        <form action="main.html" method="get">
                            
                            <div class="mb-3">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-envelope me-2 text-info"></i>Correo electrónico
                                </label>
                                <input type="email" class="form-control form-control-lg" 
                                       placeholder="ejemplo@correo.com" required>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label fw-semibold">
                                    <i class="fas fa-lock me-2 text-info"></i>Contraseña
                                </label>
                                <input type="password" class="form-control form-control-lg" 
                                       placeholder="••••••••" required>
                                
                                <div class="text-end mt-2">
                                    <a href="https://nordpass.com/es/blog/how-to-remember-passwords" target="_blank" class="text-decoration-none small text-info">
                                        ¿Olvidaste tu contraseña?
                                    </a>
                                </div>
                            </div>
                            
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">
                                    Recordar mi cuenta
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-login w-100 btn-lg mb-3">
                                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                            </button>
                            
                        </form>
                        
                        <div class="divider my-4">
                            <span class="px-3">o continúa con</span>
                        </div>
                        
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <button class="btn btn-outline-danger w-100">
                                    <i class="fab fa-google me-2"></i>Google
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-outline-primary w-100">
                                    <i class="fab fa-facebook-f me-2"></i>Facebook
                                </button>
                            </div>
                        </div>
                        
                        <p class="text-center mb-0">
                            ¿No tienes una cuenta? 
                            <a href="registro.html" class="register-link">
                                Regístrate aquí
                                <i class="fas fa-arrow-right ms-1"></i>
                            </a>
                        </p>
                        
                    </div>
                </div>                
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.querySelector('form')?.addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = 'main.html';
        });
    </script>
    
</body>
</html>
