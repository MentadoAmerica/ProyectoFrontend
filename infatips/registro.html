<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | INFA-TIPS</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>

<body class="body-registro d-flex align-items-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-9">
                
                <div class="card register-card">
                    
                    <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="home.html">
                <span class="badge bg-white text-info me-2">💙</span>
                INFA-TIPS
            </a>
            
            <div class="ms-auto">
                <a href="home.html" class="btn btn-light text-info fw-bold rounded-pill">
                    <i class="fas fa-arrow-left me-2"></i>Volver
                </a>
            </div>
        </div>
    </nav>
                    
                    <div class="register-header text-center">
                        <i class="fas fa-child fa-3x mb-3"></i>
                        <h2 class="fw-bold">Crear cuenta</h2>
                        <p class="mb-0 opacity-75">Registra los datos del tutor y del menor</p>
                    </div>
                    
                    <div class="register-body p-4 p-lg-5">
                        
                        <!-- Barra de Progreso -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <small class="text-muted">Progreso del formulario</small>
                                <small class="text-muted"><span id="progress-percent">0</span>%</small>
                            </div>
                            <div class="progress" style="height: 6px;">
                                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                        
                        <form id="registro-form" action="main.html" method="get">
                            
                            <div class="mb-4">
                                <h3 class="section-title">
                                    <i class="fas fa-user me-2"></i>Datos del Tutor
                                </h3>
                                
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label">Nombre completo del tutor <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="text" class="form-control form-input" placeholder="Ej: Juan Pérez González" 
                                                pattern="[A-Za-záéíóúñ\s]{3,}" 
                                                title="Mínimo 3 caracteres, solo letras y espacios"
                                                autocomplete="name"
                                                maxlength="100"
                                                required>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Correo electrónico <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="email" class="form-control form-input" placeholder="ejemplo@correo.com" 
                                                autocomplete="email"
                                                maxlength="100"
                                                title="Ingresa un correo válido"
                                                required>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Teléfono de contacto <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="tel" class="form-control form-input" placeholder="5512345678" 
                                                pattern="[0-9]{10}"
                                                title="Ingresa 10 dígitos sin espacios"
                                                inputmode="numeric"
                                                maxlength="10"
                                                autocomplete="tel"
                                                required>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Contraseña <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="password" class="form-control form-input password-input" placeholder="Mínimo 8 caracteres" 
                                                minlength="8"
                                                maxlength="50"
                                                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
                                                title="Debe contener mayúscula, minúscula, número y carácter especial (@$!%*?&)"
                                                autocomplete="new-password"
                                                required>
                                            <button class="btn btn-outline-secondary toggle-password" type="button" title="Ver contraseña">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                        <div class="mt-2">
                                            <small class="text-muted">Fortaleza:</small>
                                            <div class="password-strength">
                                                <div class="strength-bar"></div>
                                                <span class="strength-text text-muted">Débil</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Confirmar contraseña <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="password" class="form-control form-input password-confirm" placeholder="Repite tu contraseña" 
                                                minlength="8"
                                                maxlength="50"
                                                autocomplete="new-password"
                                                required>
                                            <button class="btn btn-outline-secondary toggle-password" type="button" title="Ver contraseña">
                                                <i class="fas fa-eye"></i>
                                            </button>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <h3 class="section-title">
                                    <i class="fas fa-baby me-2"></i>Datos del Niño(a)
                                </h3>
                                
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label">Nombre completo del menor <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="text" class="form-control form-input" placeholder="Ej: Sofía Pérez López" 
                                                pattern="[A-Za-záéíóúñ\s]{3,}"
                                                title="Mínimo 3 caracteres, solo letras y espacios"
                                                autocomplete="given-name"
                                                maxlength="100"
                                                required>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Fecha de nacimiento <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="date" class="form-control form-input" 
                                                min="1990-01-01"
                                                autocomplete="bday"
                                                required>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Edad</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control form-input" placeholder="Ej: 5" 
                                                min="0"
                                                max="17"
                                                title="La edad debe estar entre 0 y 17 años"
                                                readonly>
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Sexo <span class="text-danger">*</span></label>
                                        <select class="form-select form-input" required>
                                            <option value="">-- Selecciona --</option>
                                            <option value="femenino">Femenino</option>
                                            <option value="masculino">Masculino</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label class="form-label">Parentesco <span class="text-danger">*</span></label>
                                        <select class="form-select form-input" required>
                                            <option value="">-- Selecciona --</option>
                                            <option value="madre">Madre</option>
                                            <option value="padre">Padre</option>
                                            <option value="tutor">Tutor legal</option>
                                            <option value="abuelo">Abuelo(a)</option>
                                            <option value="otro">Otro</option>
                                        </select>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label">Foto del menor (opcional)</label>
                                        <div class="input-group">
                                            <input type="file" class="form-control form-input" 
                                                accept="image/png,image/jpeg,image/jpg,image/webp"
                                                title="Solo se aceptan imágenes (PNG, JPEG, WEBP)"
                                                aria-describedby="fotoHelp">
                                            <span class="input-icon"><i class="fas fa-check"></i></span>
                                        </div>
                                        <small id="fotoHelp" class="form-text text-muted d-block mt-1">Máximo 5MB. Formatos: PNG, JPEG, WEBP</small>
                                        <small class="form-text text-danger d-none error-message"></small>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terminos" required>
                                    <label class="form-check-label" for="terminos">
                                        Acepto el <a href="https://www.gob.mx/privacidad" target="_blank" class="text-info">aviso de privacidad</a> y el manejo de datos de salud.
                                    </label>
                                </div>
                            </div>
                            
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-register flex-grow-1" id="submit-btn">
                                    <i class="fas fa-user-plus me-2"></i><span>Crear cuenta</span>
                                </button>
                                <button type="reset" class="btn btn-reset">
                                    <i class="fas fa-eraser me-2"></i>Limpiar
                                </button>
                            </div>
                            
                            <div class="text-center mt-4">
                                <p class="mb-0">
                                    ¿Ya tienes cuenta? 
                                    <a href="login.html" class="text-info fw-bold text-decoration-none">
                                        Inicia sesión <i class="fas fa-arrow-right ms-1"></i>
                                    </a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Validación del formulario (archivo externo) -->
    <script src="js/validacion.js"></script>
</body>
</html>
